name: Release

# Pushing a tag like v0.2.0 publishes a release; `masir update` finds it from there.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog needs history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Require the update signing setup
        env:
          PUBKEY: ${{ vars.MASIR_UPDATE_PUBKEY }}
          SECRET: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$PUBKEY" ] || [ -z "$SECRET" ]; then
            echo "::error::set the MASIR_UPDATE_PUBKEY variable (minisign public key) and the MINISIGN_SECRET_KEY secret (its secret key) first"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The minisign public key(s) the built masir checks releases against.
          MASIR_UPDATE_PUBKEY: ${{ vars.MASIR_UPDATE_PUBKEY }}
          # Public PostHog project token and host, stored as repository variables.
          # GoReleaser reads them from .Env.MASIR_POSTHOG_KEY / .Env.MASIR_POSTHOG_HOST
          # in .goreleaser.yaml.
          MASIR_POSTHOG_KEY: ${{ vars.MASIR_POSTHOG_KEY }}
          MASIR_POSTHOG_HOST: ${{ vars.MASIR_POSTHOG_HOST }}
      - name: Sign the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MASIR_UPDATE_PUBKEY: ${{ vars.MASIR_UPDATE_PUBKEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          cd build/release
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m checksums.txt -x checksums.txt.minisig
          rm -f "$RUNNER_TEMP/minisign.key"
          # A signature the configured public key doesn't accept must not be published.
          # (Any one of several comma-separated keys will do.)
          ok=
          for key in $(printf '%s' "$MASIR_UPDATE_PUBKEY" | tr ',' ' '); do
            if minisign -V -P "$key" -m checksums.txt -x checksums.txt.minisig; then ok=1; fi
          done
          [ -n "$ok" ] || { echo "::error::the signature doesn't verify with MASIR_UPDATE_PUBKEY"; exit 1; }
          # Until this lands, `masir update` refuses the release ("isn't signed") and
          # tries again later; it never installs an unsigned one.
          gh release upload "$GITHUB_REF_NAME" checksums.txt.minisig
  gui:
    # After the draft release exists, so `gh release upload` has somewhere to put the apps.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: darwin
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MASIR_UPDATE_PUBKEY: ${{ vars.MASIR_UPDATE_PUBKEY }}
      MASIR_POSTHOG_KEY: ${{ vars.MASIR_POSTHOG_KEY }}
      MASIR_POSTHOG_HOST: ${{ vars.MASIR_POSTHOG_HOST }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: Require the app update signing key
        shell: bash
        env:
          SECRET: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::set the MYGO_UPDATER_PRIVATE_KEY secret (the app update signing key)"
            exit 1
          fi
      - name: Set the app's version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          perl -0pi -e 's/"version":\s*"[^"]*"/"version": "'"$version"'"/' apps/masir-gui/mygo.json
          grep '"version"' apps/masir-gui/mygo.json
      - name: Build the macOS app (arm64 and Intel)
        if: matrix.name == 'darwin'
        shell: bash
        run: make gui GUI_OS=darwin
      - name: Build the Windows app (amd64 and arm64)
        if: matrix.name == 'windows'
        shell: bash
        run: GUI_OS=windows GUI_ARCHES="amd64 arm64" sh scripts/build-gui.sh
      - name: Build the Linux app (amd64 and arm64)
        if: matrix.name == 'linux'
        shell: bash
        run: make gui GUI_OS=linux
      - name: Upload the macOS app
        if: matrix.name == 'darwin'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 amd64; do
            dir="apps/masir-gui/dist/darwin-$arch"
            gh release upload "$GITHUB_REF_NAME" \
              "$dir/masir-desktop-darwin-$version-$arch.dmg" \
              "$dir/masir-desktop-darwin-$version-$arch.tar.gz" \
              "$dir/update-darwin-$arch.json" --clobber
          done
      - name: Upload the Windows app
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          foreach ($arch in @("amd64", "arm64")) {
            $src = "apps/masir-gui/dist/windows-$arch"
            $out = "masir-desktop-windows-$version-$arch.zip"
            Compress-Archive -Path "$src/*" -DestinationPath $out
            gh release upload $env:GITHUB_REF_NAME $out `
              "$src/masir-desktop-windows-$version-$arch.tar.gz" `
              "$src/update-windows-$arch.json" --clobber
          }
      - name: Upload the Linux app
        if: matrix.name == 'linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            dir="apps/masir-gui/dist/linux-$arch"
            gh release upload "$GITHUB_REF_NAME" \
              "$dir/masir-desktop-linux-$version-$arch.deb" \
              "$dir/masir-desktop-linux-$version-$arch.tar.gz" \
              "$dir/update-linux-$arch.json" --clobber
          done
  publish:
    # A release stays a draft until the command line and every system's app are in it.
    # Failed app builds leave it unpublished instead of shipping a release that is missing
    # a platform; re-run the failed job, then this one.
    needs: [release, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
