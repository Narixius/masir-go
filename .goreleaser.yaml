# Builds masir (a single executable: the CLI and, as `masir daemon run`, the daemon)
# for each OS and architecture and publishes it, bundled with geo data, as a GitHub
# release. The updater picks archives by these names (see libs/masir-daemon/internal/update).
version: 2
project_name: masir
dist: build/release

before:
  hooks:
    - sh scripts/fetch-geo.sh

builds:
  - id: masir
    dir: apps/masir
    binary: masir
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows] # Windows builds embed the Wintun driver TUN needs
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
      # index returns "" when the variable is absent, so CI snapshots build with
      # analytics disabled instead of failing the template.
      - -X github.com/narixius/masir-go/libs/masir-daemon/internal/analytics.apiKey={{ index .Env "MASIR_POSTHOG_KEY" }}
      - -X github.com/narixius/masir-go/libs/masir-daemon/internal/analytics.host={{ index .Env "MASIR_POSTHOG_HOST" }}
      # The minisign public key(s) `masir update` checks releases against; empty in CI
      # snapshots, which then don't check. The release workflow requires it.
      - -X github.com/narixius/masir-go/libs/masir-daemon/internal/update.publicKeys={{ index .Env "MASIR_UPDATE_PUBKEY" }}

archives:
  - id: masir
    ids: [masir]
    # Every download is named <app>-<role>-<os>-<version>-<arch>; the updater asks for
    # exactly these names (see ArchiveName and UpdateArchiveName in
    # libs/masir-daemon/internal/update). This one holds masir and the geo data, so a
    # tarball is a whole install.
    name_template: "masir-cli-{{ .Os }}-{{ .Version }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: build/geo/*.dat
        strip_parent: true
  # The archive an update downloads: masir without the geo data. The job never installs
  # the geo files beside it (the geo update is its own job), so carrying 7 MB of them in
  # every update is a download nobody uses. A release without this archive still updates
  # from the one above.
  - id: masir-update
    ids: [masir]
    name_template: "masir-cli-update-{{ .Os }}-{{ .Version }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: []

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^Merge ", "^chore"]

release:
  # Published only once every system's app is uploaded (the `publish` job in the release
  # workflow), so a release never appears with half its downloads missing.
  draft: true
  github:
    owner: Narixius
    name: masir-go
