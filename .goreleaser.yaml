# Builds masir (a single executable: the CLI and, as `masir daemon run`, the daemon)
# for each OS and architecture and publishes it, bundled with geo data, as a GitHub
# release. The updater picks archives by these names (see libs/masir-daemon/internal/update).
version: 2
project_name: masir
dist: build/release

before:
  hooks:
    - sh scripts/fetch-geo.sh

builds:
  - id: masir
    dir: apps/masir
    binary: masir
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows] # Windows builds embed the Wintun driver TUN needs
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
      - -X github.com/narixius/masir-go/libs/masir-daemon/internal/analytics.apiKey={{ .Env.MASIR_POSTHOG_KEY }}
      - -X github.com/narixius/masir-go/libs/masir-daemon/internal/analytics.host={{ .Env.MASIR_POSTHOG_HOST }}

archives:
  - id: masir
    ids: [masir]
    name_template: "masir_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: build/geo/*.dat
        strip_parent: true

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^Merge ", "^chore"]

release:
  github:
    owner: Narixius
    name: masir-go
